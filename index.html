<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>たまむらふぃーるど - レベル1</title>
    <style>
        :root {
            --primary: #10b981;
            --dark: #0f172a;
            --highlight: #facc15;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: sans-serif; overflow: hidden; background-color: black;
            user-select: none; -webkit-user-select: none;
        }
        
        /* 疑似AR全画面コンテナ（児童館をイメージした背景） */
        #game-container {
            width: 100%; height: 100%; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            background: linear-gradient(rgba(15,23,42,0.2), rgba(15,23,42,0.4)), 
                        url('https://images.unsplash.com/photo-1564981797816-1043664bf78d?auto=format&fit=crop&w=1200&q=80');
            background-size: cover; background-position: center;
        }

        /* 画面上部：HUD（情報表示） */
        .hud {
            width: calc(100% - 30px); display: flex; justify-content: space-between; margin-top: 20px; z-index: 10;
        }
        .status-card {
            background: rgba(15, 23, 42, 0.85); padding: 10px 15px; border-radius: 15px;
            font-weight: bold; font-size: 14px; color: white; backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 8px;
        }
        #timer { color: #f87171; font-size: 18px; }
        #score { color: #34d399; font-size: 18px; }

        /* 中央：敵モンスターエリア */
        #enemy-area {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex-grow: 1; z-index: 5; position: relative; margin-bottom: 20px;
        }
        #enemy {
            font-size: 120px; line-height: 1; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: all 0.2s ease; animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .hp-container {
            width: 160px; height: 12px; background: rgba(255,255,255,0.3);
            border-radius: 6px; margin-top: 15px; overflow: hidden; border: 1px solid rgba(0,0,0,0.2);
        }
        #hp-bar { width: 100%; height: 100%; background: #ef4444; transition: width 0.1s ease; }
        #hp-text { color: white; font-size: 12px; font-weight: bold; margin-top: 5px; text-shadow: 1px 1px 3px black; }

        /* ナビゲーションメッセージ */
        #guide-msg {
            background: rgba(0,0,0,0.7); color: white; padding: 8px 20px; border-radius: 20px;
            font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 10px; z-index: 10;
        }

        /* 下部：ボタン操作エリア */
        .control-panel {
            width: 100%; background: rgba(15, 23, 42, 0.9); padding: 20px 0 40px 0;
            border-radius: 25px 25px 0 0; display: flex; flex-direction: column; align-items: center;
            gap: 15px; box-shadow: 0 -10px 25px rgba(0,0,0,0.5); border-top: 2px solid rgba(255,255,255,0.1); z-index: 10;
        }
        .button-grid {
            width: calc(100% - 30px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        
        /* 基本ボタン定義 */
        .btn {
            background: #334155; color: #94a3b8; border: none; padding: 18px 0;
            font-size: 22px; font-weight: bold; border-radius: 16px; cursor: pointer;
            box-shadow: 0 6px #1e293b, 0 8px 15px rgba(0,0,0,0.4); transition: all 0.1s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .btn:active:not(.disabled) { transform: translateY(4px); box-shadow: 0 2px #1e293b, 0 4px 10px rgba(0,0,0,0.4); }
        
        /* 選択状態（アクティブ） */
        .btn.selected {
            background: #2563eb !important; color: white !important; box-shadow: 0 6px #1d4ed8, 0 8px 15px rgba(37,99,235,0.3) !important;
        }
        /* ランダムハイライト状態 */
        .btn.highlight {
            background: var(--highlight); color: var(--dark);
            box-shadow: 0 6px #ca8a04, 0 0 15px var(--highlight);
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 0.9; } 100% { opacity: 1; transform: scale(1.02); }
        }

        /* 攻撃ボタンD */
        #btn-d {
            width: calc(100% - 30px); background: linear-gradient(135deg, #ef4444, #dc2626); color: white;
            font-size: 24px; letter-spacing: 2px; padding: 15px 0; border-radius: 16px; border: none; font-weight: bold;
            box-shadow: 0 6px #991b1b, 0 8px 20px rgba(220,38,38,0.4); cursor: pointer; transition: all 0.1s;
        }
        #btn-d:active:not(.disabled) { transform: translateY(4px); box-shadow: 0 2px #991b1b, 0 4px 10px rgba(220,38,38,0.4); }
        #btn-d.ready { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 6px #92400e; }

        /* エフェクト用 */
        #flash { position: absolute; width:100%; height:100%; background:white; opacity:0; pointer-events:none; z-index: 6; }
        .damage-pop {
            position: absolute; color: #ffeb3b; font-size: 36px; font-weight: bold;
            text-shadow: 2px 2px 0 #000; animation: floatUp 0.5s ease-out forwards; z-index: 7;
        }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity:1; } 100% { transform: translateY(-50px) scale(1.2); opacity:0; } }
        .shake { animation: shakeEffect 0.15s linear; }
        @keyframes shakeEffect { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-6px,0); } 75% { transform: translate(6px,0); } }
        
        /* スタート・ゲームオーバー画面オーバーレイ */
        .overlay {
            position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.95);
            display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; color:white; padding:20px; box-sizing:border-box;
        }
        .overlay h2 { font-size: 32px; color: var(--highlight); margin-bottom: 10px; text-align: center; }
        .overlay p { font-size: 16px; color: #94a3b8; margin-bottom: 30px; text-align: center; max-width: 300px; line-height: 1.5; }
        .start-btn {
            background: var(--primary); color: white; border:none; padding:15px 40px; font-size:20px; font-weight:bold; border-radius:30px; cursor:pointer; box-shadow: 0 4px #059669;
        }
        .start-btn:active { transform: translateY(2px); box-shadow: 0 2px #059669; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="flash"></div>

    <div id="start-overlay" class="overlay">
        <h2>たまむらふぃーるど<br><span style="font-size:20px; color:white;">レベル1：実証実験始動</span></h2>
        <p>【遊び方】<br>30秒以内に敵を倒せ！<br>光っている「選択ボタン」を押してから「攻撃ボタンD」を押そう！</p>
        <button class="start-btn" onclick="startGame()">ゲームスタート！</button>
    </div>

    <div id="result-overlay" class="overlay" style="display: none;">
        <h2 id="result-title">クリア！</h2>
        <p id="result-text">おめでとうございます！</p>
        <button class="start-btn" onclick="location.reload()">もう一度遊ぶ</button>
    </div>

    <div class="hud">
        <div class="status-card">タイム: <span id="timer">30</span> 秒</div>
        <div class="status-card">LV.1 敵：たまご竜</div>
        <div class="status-card">獲得: <span id="score">0</span> PT</div>
    </div>

    <div id="enemy-area">
        <div id="enemy">🦖</div>
        <div class="hp-container">
            <div id="hp-bar"></div>
        </div>
        <div id="hp-text">HP: 100 / 100</div>
    </div>

    <div id="guide-msg">光るボタンを選択しよう！</div>

    <div class="control-panel">
        <div class="button-grid">
            <button id="btn-a" class="btn" onclick="selectButton('A')">A</button>
            <button id="btn-b" class="btn" onclick="selectButton('B')">B</button>
            <button id="btn-c" class="btn" onclick="selectButton('C')">C</button>
        </div>
        <button id="btn-d" onclick="pressAttack()">攻撃ボタンD</button>
    </div>
</div>

<script>
    // ゲームステート
    let currentHp = 100;
    const maxHp = 100;
    let timeLimit = 30;
    let scorePoints = 0;
    let gameInterval;
    let bgmInterval;
    let isPlaying = false;

    let targetButton = '';   // 現在ハイライトしている正解ボタン (A, B, or C)
    let selectedButton = ''; // プレイヤーが現在選択しているボタン

    // Web Audio API 用の変数 (3和音BGM・効果音用)
    let audioCtx = null;

    // ゲーム開始
    function startGame() {
        document.getElementById('start-overlay').style.display = 'none';
        isPlaying = true;
        initAudio();
        startBpmMusic();
        nextTurn();
        
        // タイマー開始
        gameInterval = setInterval(() => {
            timeLimit--;
            document.getElementById('timer').innerText = timeLimit;
            if (timeLimit <= 0) {
                endGame(false, "タイムアップ！");
            }
        }, 1000);
    }

    // 次のターン（ランダムハイライトの再設定）
    function nextTurn() {
        if (!isPlaying) return;
        
        // リセット
        ['A', 'B', 'C'].forEach(ch => {
            const btn = document.getElementById(`btn-${ch.toLowerCase()}`);
            btn.classList.remove('highlight', 'selected');
        });
        selectedButton = '';
        document.getElementById('btn-d').classList.remove('ready');

        // A, B, C の中からランダムに1つ選択してハイライト
        const buttons = ['A', 'B', 'C'];
        targetButton = buttons[Math.floor(Math.random() * buttons.length)];
        document.getElementById(`btn-${targetButton.toLowerCase()}`).classList.add('highlight');
        document.getElementById('guide-msg').innerText = `選択ボタン【 ${targetButton} 】を押そう！`;
    }

    // A,B,Cの選択処理
    function selectButton(type) {
        if (!isPlaying) return;
        
        // 他の選択状態を解除
        ['A', 'B', 'C'].forEach(ch => document.getElementById(`btn-${ch.toLowerCase()}`).classList.remove('selected'));
        
        selectedButton = type;
        document.getElementById(`btn-${type.toLowerCase()}`).classList.add('selected');
        
        // 正解ボタンを選択した場合はDボタンを「準備完了(ready)」状態にする
        if (selectedButton === targetButton) {
            document.getElementById('btn-d').classList.add('ready');
            playTone(440, 'triangle', 0.1, 0.2); // 選択音
            document.getElementById('guide-msg').innerText = "準備完了！ 攻撃ボタンDを狙え！";
        } else {
            document.getElementById('btn-d').classList.remove('ready');
            playTone(220, 'sawtooth', 0.1, 0.1); // ミス選択音
            document.getElementById('guide-msg').innerText = `ちがうよ！【 ${targetButton} 】を押してね！`;
        }
    }

    // 攻撃ボタンDを押したとき
    function pressAttack() {
        if (!isPlaying) return;

        if (selectedButton === targetButton) {
            // 攻撃成功！
            currentHp -= 10;
            scorePoints += 10;
            if (currentHp < 0) currentHp = 0;

            // UI更新
            document.getElementById('score').innerText = scorePoints;
            document.getElementById('hp-bar').style.width = `${(currentHp / maxHp) * 100}%`;
            document.getElementById('hp-text').innerText = `HP: ${currentHp} / ${maxHp}`;

            // 演出効果
            triggerEffects();
            playAttackSound();

            if (currentHp <= 0) {
                endGame(true, "レベル1 クリア！");
            } else {
                nextTurn();
            }
        } else {
            // 条件を満たさずにDを押した場合（空振り・ペナルティなし、親切設計）
            playTone(150, 'sawtooth', 0.2, 0.3);
            document.getElementById('guide-msg').innerText = `先に【 ${targetButton} 】を選んでね！`;
        }
    }

    // 演出用
    function triggerEffects() {
        const flash = document.getElementById('flash');
        flash.style.opacity = '0.6';
        setTimeout(() => flash.style.opacity = '0', 50);

        const enemy = document.getElementById('enemy');
        enemy.classList.add('shake');
        setTimeout(() => enemy.classList.remove('shake'), 150);

        // ダメージ数値ポップアップ
        const pop = document.createElement('div');
        pop.className = 'damage-pop';
        pop.innerText = '-10';
        const area = document.getElementById('enemy-area');
        pop.style.top = '30%';
        area.appendChild(pop);
        setTimeout(() => pop.remove(), 500);
    }

    // ゲーム終了
    function endGame(isWin, message) {
        isPlaying = false;
        clearInterval(gameInterval);
        clearInterval(bgmInterval);

        document.getElementById('result-overlay').style.display = 'flex';
        document.getElementById('result-title').innerText = isWin ? "LEVEL 1 CLEAR!" : "GAME OVER";
        document.getElementById('result-text').innerText = message;

        if (isWin) {
            // ファンファーレ
            playFanfare();
        } else {
            playTone(100, 'sawtooth', 0.8, 0.5);
        }
    }

    /* --- Web Audio 3和音擬似サウンドシステム --- */
    function initAudio() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq, type, duration, volume) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gainNode = audioCtx.createGain();
        
        osc.type = type;
        osc.frequency.value = freq;
        gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // レトロゲーム風3和音BGM（ピコピコ動くループ）
    function startBpmMusic() {
        const notesTrack1 = [261.63, 293.66, 329.63, 349.23, 392.00, 349.23, 329.63, 293.66]; // ドレミファソファミレ
        const notesTrack2 = [196.00, 220.00, 246.94, 261.63, 293.66, 261.63, 246.94, 220.00]; // 低いソラシドレドシラ
        let index = 0;

        bgmInterval = setInterval(() => {
            if (!isPlaying) return;
            // 1和音目（主旋律：矩形波でピコピコ）
            playTone(notesTrack1[index], 'square', 0.2, 0.04);
            // 2和音目（伴奏ベース：三角波でマイルドに）
            if (index % 2 === 0) {
                playTone(notesTrack2[index], 'triangle', 0.3, 0.06);
            }
            // 3和音目（裏拍アクセントリズム）
            if (index % 4 === 2) {
                playTone(587.33, 'sine', 0.1, 0.02); // 高いレ
            }
            index = (index + 1) % notesTrack1.length;
        }, 250); // テンポよく刻む
    }

    // 攻撃時のドゴォン効果音（複数オシレーターで厚みを出す）
    function playAttackSound() {
        playTone(180, 'sawtooth', 0.15, 0.3);
        playTone(90, 'square', 0.2, 0.4);
    }

    // クリア時のファンファーレ
    function playFanfare() {
        setTimeout(() => playTone(523.25, 'square', 0.15, 0.1), 0);   // ド
        setTimeout(() => playTone(587.33, 'square', 0.15, 0.1), 150); // レ
        setTimeout(() => playTone(659.25, 'square', 0.15, 0.1), 300); // ミ
        setTimeout(() => playTone(783.99, 'square', 0.4, 0.1), 450);  // ソー！
    }
</script>

</body>
</html>
