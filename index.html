<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>たまむらふぃーるど - レベル1(WebARカメラ版)</title>
    <style>
        :root {
            --primary: #10b981;
            --dark: #0f172a;
            --highlight: #facc15;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: sans-serif; overflow: hidden; background-color: black;
            user-select: none; -webkit-user-select: none;
        }
        
        /* 全画面カメラ映像エリア */
        #game-container {
            width: 100%; height: 100%; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
        }
        video {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }

        /* カメラのフラッシュエフェクト */
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; z-index: 2; pointer-events: none; }

        /* 画面上部：HUD（情報表示） */
        .hud {
            width: calc(100% - 30px); display: flex; justify-content: space-between; margin-top: 20px; z-index: 10;
        }
        .status-card {
            background: rgba(15, 23, 42, 0.8); padding: 10px 15px; border-radius: 20px;
            font-weight: bold; font-size: 14px; color: white; backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 8px;
        }
        #timer { color: #f87171; font-size: 18px; }
        #score { color: #34d399; font-size: 18px; }

        /* 中央：AR空間に浮遊する敵モンスターエリア */
        #enemy-area {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex-grow: 1; z-index: 5; position: relative; margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        #enemy {
            font-size: 130px; line-height: 1; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.5));
            transition: all 0.2s ease;
        }
        .hp-container {
            width: 140px; height: 10px; background: rgba(255,255,255,0.4);
            border-radius: 5px; margin-top: 15px; overflow: hidden;
        }
        #hp-bar { width: 100%; height: 100%; background: #ef4444; transition: width 0.1s ease; }

        /* ナビゲーションメッセージ */
        #guide-msg {
            background: rgba(0,0,0,0.6); color: white; padding: 6px 16px; border-radius: 15px;
            font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 10px; z-index: 10;
            backdrop-filter: blur(4px);
        }

        /* 下部：ボタン操作エリア */
        .control-panel {
            width: 100%; background: rgba(15, 23, 42, 0.85); padding: 20px 0 40px 0;
            border-radius: 25px 25px 0 0; display: flex; flex-direction: column; align-items: center;
            gap: 15px; box-shadow: 0 -10px 25px rgba(0,0,0,0.4); border-top: 1px solid rgba(255,255,255,0.2); z-index: 10;
            backdrop-filter: blur(8px);
        }
        .button-grid {
            width: calc(100% - 30px); display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        
        /* 基本ボタン定義 */
        .btn {
            background: rgba(51, 65, 85, 0.8); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.1); padding: 18px 0;
            font-size: 22px; font-weight: bold; border-radius: 16px; cursor: pointer;
            box-shadow: 0 6px rgba(30, 41, 59, 0.9); transition: all 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px rgba(30, 41, 59, 0.9); }
        
        /* 選択状態（アクティブ） */
        .btn.selected {
            background: #2563eb !important; color: white !important; box-shadow: 0 6px #1d4ed8 !important;
        }
        /* ランダムハイライト状態 */
        .btn.highlight {
            background: var(--highlight) !important; color: var(--dark) !important;
            box-shadow: 0 6px #ca8a04, 0 0 15px var(--highlight) !important;
            text-shadow: none;
        }

        /* 攻撃ボタンD */
        #btn-d {
            width: calc(100% - 30px); background: linear-gradient(135deg, #ef4444, #dc2626); color: white;
            font-size: 24px; letter-spacing: 2px; padding: 15px 0; border-radius: 16px; border: none; font-weight: bold;
            box-shadow: 0 6px #991b1b, 0 8px 20px rgba(220,38,38,0.3); cursor: pointer; transition: all 0.1s;
        }
        #btn-d:active { transform: translateY(4px); box-shadow: 0 2px #991b1b; }
        #btn-d.ready { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 6px #92400e; }

        /* エフェクト用 */
        .spark {
            position: absolute; color: #ffeb3b; font-size: 40px; font-weight: bold;
            text-shadow: 0 0 8px #ff5722; animation: explode 0.4s ease-out forwards; z-index: 6; pointer-events: none;
        }
        @keyframes explode { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        .shake { animation: shakeEffect 0.15s linear; }
        @keyframes shakeEffect { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-8px,0); } 75% { transform: translate(8px,0); } }
        
        /* オーバーレイ */
        .overlay {
            position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.95);
            display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100; color:white; padding:20px; box-sizing:border-box;
        }
        .overlay h2 { font-size: 28px; color: var(--highlight); margin-bottom: 10px; text-align: center; }
        .overlay p { font-size: 15px; color: #94a3b8; margin-bottom: 30px; text-align: center; max-width: 300px; line-height: 1.6; }
        .start-btn {
            background: var(--primary); color: white; border:none; padding:15px 40px; font-size:18px; font-weight:bold; border-radius:30px; cursor:pointer; box-shadow: 0 4px #059669;
        }
    </style>
</head>
<body>

<div id="game-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="flash"></div>

    <div id="start-overlay" class="overlay">
        <h2>たまむらふぃーるど<br><span style="font-size:18px; color:white;">LV.1 カメラ連携デモ</span></h2>
        <p>【ミッション】<br>30秒以内に正面のたまご竜を撃破せよ！<br><br>下ので黄色く光る「選択ボタン」をタップしてロックオンし、赤の「攻撃ボタンD」でシュート！</p>
        <button class="start-btn" onclick="startGame()">カメラを許可して開始</button>
    </div>

    <div id="result-overlay" class="overlay" style="display: none;">
        <h2 id="result-title">クリア！</h2>
        <p id="result-text">おめでとうございます！</p>
        <button class="start-btn" onclick="location.reload()">もう一度挑戦する</button>
    </div>

    <div class="hud">
        <div class="status-card">タイム: <span id="timer">30</span> 秒</div>
        <div class="status-card" id="info-text">玉村町 児童館ARエリア</div>
        <div class="status-card">獲得: <span id="score">0</span> PT</div>
    </div>

    <div id="enemy-area">
        <div id="enemy">🦖</div>
        <div class="hp-container">
            <div id="hp-bar"></div>
        </div>
    </div>

    <div id="guide-msg">光るボタンをタッチ！</div>

    <div class="control-panel">
        <div class="button-grid">
            <button id="btn-a" class="btn" onclick="selectButton('A')">A</button>
            <button id="btn-b" class="btn" onclick="selectButton('B')">B</button>
            <button id="btn-c" class="btn" onclick="selectButton('C')">C</button>
        </div>
        <button id="btn-d" onclick="pressAttack()">攻撃ボタンD</button>
    </div>
</div>

<script>
    let currentHp = 100;
    const maxHp = 100;
    let timeLimit = 30;
    let scorePoints = 0;
    let gameInterval, bgmInterval;
    let isPlaying = false;
    let targetButton = '', selectedButton = '';
    let audioCtx = null;

    // カメラ起動処理（背面カメラをリクエスト。無ければ通常カメラ）
    async function startCamera() {
        const constraints = {
            video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
        };
        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            document.getElementById('video').srcObject = stream;
        } catch (err) {
            console.error("Camera error:", err);
            document.getElementById('info-text').innerText = "擬似ARモード(カメラ無し)";
        }
    }

    function startGame() {
        document.getElementById('start-overlay').style.display = 'none';
        isPlaying = true;
        
        // カメラと音声の開始
        startCamera();
        initAudio();
        startBpmMusic();
        nextTurn();
        
        gameInterval = setInterval(() => {
            timeLimit--;
            document.getElementById('timer').innerText = timeLimit;
            if (timeLimit <= 0) endGame(false, "タイムアップ！");
        }, 1000);
    }

    function nextTurn() {
        if (!isPlaying) return;
        ['A', 'B', 'C'].forEach(ch => document.getElementById(`btn-${ch.toLowerCase()}`).classList.remove('highlight', 'selected'));
        selectedButton = '';
        document.getElementById('btn-d').classList.remove('ready');

        const buttons = ['A', 'B', 'C'];
        targetButton = buttons[Math.floor(Math.random() * buttons.length)];
        document.getElementById(`btn-${targetButton.toLowerCase()}`).classList.add('highlight');
        document.getElementById('guide-msg').innerText = `【 ${targetButton} 】ボタンをロックオンせよ！`;
    }

    function selectButton(type) {
        if (!isPlaying) return;
        ['A', 'B', 'C'].forEach(ch => document.getElementById(`btn-${ch.toLowerCase()}`).classList.remove('selected'));
        selectedButton = type;
        document.getElementById(`btn-${type.toLowerCase()}`).classList.add('selected');
        
        if (selectedButton === targetButton) {
            document.getElementById('btn-d').classList.add('ready');
            playTone(440, 'triangle', 0.1, 0.2);
            document.getElementById('guide-msg').innerText = "ロックオン完了！ 攻撃ボタンDを発射！";
        } else {
            document.getElementById('btn-d').classList.remove('ready');
            playTone(220, 'sawtooth', 0.1, 0.1);
            document.getElementById('guide-msg').innerText = `ロック対象が違います！【 ${targetButton} 】を選択して！`;
        }
    }

    function pressAttack() {
        if (!isPlaying) return;

        if (selectedButton === targetButton) {
            currentHp -= 10;
            scorePoints += 10;
            if (currentHp < 0) currentHp = 0;

            document.getElementById('score').innerText = scorePoints;
            document.getElementById('hp-bar').style.width = `${(currentHp / maxHp) * 100}%`;

            triggerEffects();
            playAttackSound();

            if (currentHp <= 0) {
                endGame(true, "レベル1 ミッションクリア！");
            } else {
                nextTurn();
            }
        } else {
            playTone(150, 'sawtooth', 0.2, 0.3);
            document.getElementById('guide-msg').innerText = `エラー！先に【 ${targetButton} 】を狙ってください`;
        }
    }

    function triggerEffects() {
        const flash = document.getElementById('flash');
        flash.style.opacity = '0.5';
        setTimeout(() => flash.style.opacity = '0', 60);

        const enemy = document.getElementById('enemy');
        enemy.classList.add('shake');
        setTimeout(() => enemy.classList.remove('shake'), 150);

        const spark = document.createElement('div');
        spark.className = 'spark';
        spark.innerText = '💥';
        const rect = enemy.getBoundingClientRect();
        spark.style.left = (rect.left + rect.width / 2 - 20) + 'px';
        spark.style.top = (rect.top + rect.height / 2 - 20) + 'px';
        document.getElementById('game-container').appendChild(spark);
        setTimeout(() => spark.remove(), 400);
    }

    function endGame(isWin, message) {
        isPlaying = false;
        clearInterval(gameInterval);
        clearInterval(bgmInterval);
        
        // カメラストリーム停止
        const stream = document.getElementById('video').srcObject;
        if (stream) stream.getTracks().forEach(track => track.stop());

        document.getElementById('result-overlay').style.display = 'flex';
        document.getElementById('result-title').innerText = isWin ? "CLEAR!" : "GAME OVER";
        document.getElementById('result-text').innerText = message;

        if (isWin) playFanfare();
        else playTone(100, 'sawtooth', 0.8, 0.5);
    }

    /* --- オーディオシンセサイズ --- */
    function initAudio() { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playTone(freq, type, duration, volume) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain();
        osc.type = type; osc.frequency.value = freq;
        gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function startBpmMusic() {
        const notes = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23];
        let index = 0;
        bgmInterval = setInterval(() => {
            if (!isPlaying) return;
            playTone(notes[index], 'square', 0.15, 0.03); // 主旋律
            if (index % 2 === 0) playTone(notes[(index+2)%notes.length]/2, 'triangle', 0.2, 0.06); // ベース
            index = (index + 1) % notes.length;
        }, 200);
    }

    function playAttackSound() { playTone(160, 'sawtooth', 0.15, 0.2); playTone(80, 'square', 0.2, 0.3); }
    function playFanfare() {
        const f = [523.25, 587.33, 659.25, 783.99];
        f.forEach((note, i) => setTimeout(() => playTone(note, 'square', i===3?0.5:0.15, 0.1), i*150));
    }
</script>

</body>
</html>
