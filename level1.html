<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>たまむらふぃーるど - レベル1バトル</title>
    <style>
        :root {
            --primary: #005088;
            --accent: #facc15;
            --danger: #ef4444;
            --dark: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: black; color: white; overflow: hidden; }
        
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; z-index: 2; pointer-events: none; }
        
        .hud { width: 100%; display: flex; justify-content: space-between; padding: 15px; z-index: 10; position: relative; }
        .hud-card { background: rgba(15, 23, 42, 0.85); padding: 8px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px); }
        #timer { color: #f87171; font-size: 14px; }
        #score { color: #34d399; font-size: 14px; }
        
        .arena { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; position: relative; height: 45vh; }
        #active-monster { font-size: 120px; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.6)); transition: all 0.2s ease; animation: float 3s ease-in-out infinite; line-height: 1; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        
        .hp-frame { width: 160px; height: 12px; background: rgba(255,255,255,0.3); border-radius: 6px; margin-top: 15px; overflow: hidden; border: 1px solid black; }
        #hp-bar { width: 100%; height: 100%; background: var(--danger); transition: width 0.1s; }
        #hp-text { color: white; font-size: 12px; font-weight: bold; margin-top: 5px; text-shadow: 1px 1px 3px black; z-index: 6; }
        
        #instruction { background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; margin: 10px auto; z-index: 10; text-align: center; width: 80%; border: 1px solid rgba(255,255,255,0.2); position: relative; backdrop-filter: blur(4px); }
        
        .controls { width: 100%; background: rgba(15, 23, 42, 0.95); padding: 20px 15px 40px 15px; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 15px; z-index: 10; position: fixed; bottom: 0; left: 0; border-top: 2px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .abc-btn { background: #334155; color: #94a3b8; border: 1px solid #475569; padding: 18px 0; font-size: 22px; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 4px #1e293b, 0 4px 10px rgba(0,0,0,0.3); transition: all 0.1s; }
        .abc-btn:active:not(.disabled) { transform: translateY(2px); box-shadow: 0 2px #1e293b; }
        
        /* 選択・ハイライト状態 */
        .abc-btn.selected { background: #2563eb !important; color: white !important; box-shadow: 0 4px #1d4ed8, 0 4px 10px rgba(37,99,235,0.3) !important; }
        .abc-btn.highlight { background: var(--accent) !important; color: var(--dark) !important; box-shadow: 0 4px #ca8a04, 0 0 15px var(--accent) !important; animation: pulse 1s infinite alternate; }
        @keyframes pulse { 0% { opacity: 0.9; } 100% { opacity: 1; transform: scale(1.02); } }
        
        /* 攻撃ボタンD */
        #shoot-btn { width: 100%; background: linear-gradient(135deg, #ef4444, #dc2626); color: white; font-size: 22px; font-weight: bold; padding: 14px 0; border-radius: 12px; border: none; box-shadow: 0 5px #991b1b, 0 4px 10px rgba(220,38,38,0.3); cursor: pointer; transition: all 0.1s; }
        #shoot-btn:active:not(.disabled) { transform: translateY(3px); box-shadow: 0 2px #991b1b; }
        #shoot-btn.ready { background: linear-gradient(135deg, #f59e0b, #d97706) !important; box-shadow: 0 5px #92400e, 0 4px 12px rgba(245,158,11,0.4) !important; }

        /* エフェクト用 */
        .sparkle { position: absolute; font-size: 40px; animation: burst 0.4s ease-out forwards; pointer-events: none; z-index: 20; text-shadow: 0 0 8px #ff5722; }
        @keyframes burst { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        .shake { animation: shakeAnim 0.15s linear; }
        @keyframes shakeAnim { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-6px,0); } 75% { transform: translate(6px,0); } }
        .damage-pop { position: absolute; color: #ffeb3b; font-size: 36px; font-weight: bold; text-shadow: 2px 2px 0 #000; animation: floatUp 0.5s ease-out forwards; z-index: 7; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity:1; } 100% { transform: translateY(-50px) scale(1.2); opacity:0; } }

        /* バトル終了画面 */
        .result { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; padding: 30px; text-align: center; color: white; }
        .res-title { font-size: 32px; color: var(--accent); margin-bottom: 20px; font-weight: bold; font-family: serif; }
        .res-body { font-size: 16px; margin-bottom: 30px; line-height: 1.6; color: #cbd5e1; }
        .back-btn { background: #10b981; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer; width: 80%; max-width: 280px; box-shadow: 0 4px #059669; }
        .back-btn:active { transform: translateY(2px); box-shadow: 0 2px #059669; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <div id="flash"></div>

    <div class="hud">
        <div class="hud-card">タイム: <span id="timer">30</span> 秒</div>
        <div class="hud-card" id="loc-name">バトルエリア</div>
        <div class="hud-card">獲得: <span id="score">0</span> PT</div>
    </div>

    <div class="arena">
        <div id="active-monster">🦖</div>
        <div class="hp-frame"><div id="hp-bar"></div></div>
        <div id="hp-text">HP: 100 / 100</div>
    </div>

    <div id="instruction">光るボタンを選択しよう！</div>

    <div class="controls">
        <div class="grid-3">
            <button id="btn-a" class="abc-btn" onclick="tapAbc('A')">A</button>
            <button id="btn-b" class="abc-btn" onclick="tapAbc('B')">B</button>
            <button id="btn-c" class="abc-btn" onclick="tapAbc('C')">C</button>
        </div>
        <button id="shoot-btn" onclick="attack()">攻撃ボタンD</button>
    </div>

    <div id="resBoard" class="result">
        <div class="res-title" id="resTitle">LEVEL 1 CLEAR!</div>
        <div class="res-body" id="resBody">結果</div>
        <button class="back-btn" onclick="back()">マップに戻る</button>
    </div>

    <script>
        let hp = 100, score = 0, time = 30;
        let target = '', selected = '';
        let timerInterval, bgmInterval, audioCtx;

        window.onload = function() {
            // 前画面からのデータを復元
            document.getElementById('loc-name').innerText = sessionStorage.getItem('current_battle_name') || '玉村町エリア';
            document.getElementById('active-monster').innerText = sessionStorage.getItem('current_battle_monster') || '🦖';
            
            // WebAR背面カメラの起動リクエスト
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
                .then(stream => { document.getElementById('video').srcObject = stream; })
                .catch(() => { console.log("疑似AR空間（カメラなし）で起動しました"); });

            // サウンドの初期化と自動再生
            initAudio();
            startBpmMusic();
            nextTurn();

            // 30秒カウントダウンタイマー
            timerInterval = setInterval(() => {
                time--;
                document.getElementById('timer').innerText = time;
                if(time <= 0) end(false, "タイムアップ！");
            }, 1000);
        };

        // 次のターゲット選定（日本語ガイド連動）
        function nextTurn() {
            ['a','b','c'].forEach(l => document.getElementById(`btn-${l}`).classList.remove('highlight','selected'));
            selected = '';
            document.getElementById('shoot-btn').classList.remove('ready');
            
            target = ['A','B','C'][Math.floor(Math.random()*3)];
            document.getElementById(`btn-${target.toLowerCase()}`).classList.add('highlight');
            document.getElementById('instruction').innerText = `選択ボタン【 ${target} 】を押そう！`;
        }

        // 選択ボタンA,B,Cをタップしたとき
        function tapAbc(l) {
            ['a','b','c'].forEach(i => document.getElementById(`btn-${i}`).classList.remove('selected'));
            selected = l;
            document.getElementById(`btn-${l.toLowerCase()}`).classList.add('selected');
            
            if(selected === target) {
                document.getElementById('shoot-btn').classList.add('ready');
                document.getElementById('instruction').innerText = "準備完了！ 攻撃ボタンDを狙え！";
                playTone(440, 'triangle', 0.1, 0.2); // 選択成功音
            } else {
                document.getElementById('shoot-btn').classList.remove('ready');
                document.getElementById('instruction').innerText = `ちがうよ！【 ${target} 】を押してね！`;
                playTone(220, 'sawtooth', 0.1, 0.1); // ミス選択音
            }
        }

        // 攻撃ボタンDを押したとき
        function attack() {
            if(selected !== target) {
                playTone(150, 'sawtooth', 0.2, 0.3);
                document.getElementById('instruction').innerText = `先に【 ${target} 】を選んでね！`;
                return;
            }
            
            // 攻撃ヒット：HPとスコアの変動
            hp -= 20; // 5回攻撃で綺麗に討伐できる親切設計
            score += 10;
            if (hp < 0) hp = 0;

            document.getElementById('score').innerText = score;
            document.getElementById('hp-bar').style.width = `${hp}%`;
            document.getElementById('hp-text').innerText = `HP: ${hp} / 100`;
            
            // ビジュアル演出
            triggerHitEffects();

            if(hp <= 0) {
                end(true, "レベル1 クリア！");
            } else {
                nextTurn();
            }
        }

        // 各種ヒットエフェクト
        function triggerHitEffects() {
            // カメラフラッシュ
            document.getElementById('flash').style.opacity = '0.6';
            setTimeout(() => document.getElementById('flash').style.opacity = '0', 50);
            
            // モンスターのシェイク（振動）
            const monsterEl = document.getElementById('active-monster');
            monsterEl.classList.add('shake');
            setTimeout(() => monsterEl.classList.remove('shake'), 150);
            
            // 爆発絵文字エフェクト
            const spark = document.createElement('div');
            spark.className = 'sparkle';
            spark.innerText = '💥';
            const rect = monsterEl.getBoundingClientRect();
            spark.style.left = (rect.left + rect.width / 2 - 20) + 'px';
            spark.style.top = (rect.top + rect.height / 2 - 20) + 'px';
            document.body.appendChild(spark);
            setTimeout(() => spark.remove(), 400);

            // ダメージポップアップ数値 (-10)
            const pop = document.createElement('div');
            pop.className = 'damage-pop';
            pop.innerText = '-10';
            pop.style.left = (rect.left + rect.width / 2 - 20) + 'px';
            pop.style.top = (rect.top - 20) + 'px';
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 500);

            // 破壊的なSE（複数オシレーターで厚みを再現）
            playTone(180, 'sawtooth', 0.15, 0.3);
            playTone(90, 'square', 0.2, 0.4);
        }

        // バトルゲーム終了処理
        function end(success, msg) {
            clearInterval(timerInterval);
            clearInterval(bgmInterval);
            
            document.getElementById('resBoard').style.display = 'flex';
            document.getElementById('resTitle').innerText = success ? "LEVEL 1 CLEAR!" : "GAME OVER";
            document.getElementById('resBody').innerHTML = `${msg}<br><br><span style="color:#facc15;font-size:24px;font-weight:bold;">+ ${score} PT 獲得！</span>`;
            
            if(success) {
                // ローカルストレージにポイントを加算して永続保存
                let total = parseInt(localStorage.getItem('tamamura_points_demo') || '0');
                localStorage.setItem('tamamura_points_demo', total + score);
                playFanfare();
            } else {
                playTone(100, 'sawtooth', 0.8, 0.5);
            }
        }

        // マップ画面へ安全にURL遷移
        function back() { window.location.href = 'index.html'; }

        /* --- Web Audio 3和音レトロサウンドシステム --- */
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playTone(freq, type, duration, volume) {
            if(!audioCtx) return;
            let osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        // ピコピコ動く3和音BGMループ
        function startBpmMusic() {
            const notesTrack1 = [261.63, 293.66, 329.63, 349.23, 392.00, 349.23, 329.63, 293.66]; // ドレミファソファミレ
            const notesTrack2 = [196.00, 220.00, 246.94, 261.63, 293.66, 261.63, 246.94, 220.00]; // 低いソラシドレドシラ
            let index = 0;

            bgmInterval = setInterval(() => {
                // 1和音目（主旋律：矩形波）
                playTone(notesTrack1[index], 'square', 0.2, 0.04);
                // 2和音目（ベース：三角波）
                if (index % 2 === 0) {
                    playTone(notesTrack2[index], 'triangle', 0.3, 0.06);
                }
                // 3和音目（裏拍アクセントサイン波）
                if (index % 4 === 2) {
                    playTone(587.33, 'sine', 0.1, 0.02); // 高いレ
                }
                index = (index + 1) % notesTrack1.length;
            }, 250);
        }

        // ゲームクリアのファンファーレ
        function playFanfare() {
            setTimeout(() => playTone(523.25, 'square', 0.15, 0.1), 0);   // ド
            setTimeout(() => playTone(587.33, 'square', 0.15, 0.1), 150); // レ
            setTimeout(() => playTone(659.25, 'square', 0.15, 0.1), 300); // ミ
            setTimeout(() => playTone(783.99, 'square', 0.4, 0.1), 450);  // ソー！
        }
    </script>
</body>
</html>
